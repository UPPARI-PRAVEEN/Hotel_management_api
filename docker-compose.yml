services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    container_name: hotel_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: hotel_intelligence
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: admin123
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  clickhouse-data:
